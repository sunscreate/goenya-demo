<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>動画を保存</title>
<style>body{font-family:sans-serif;padding:24px;text-align:center}button{font-size:22px;padding:18px 28px;margin:14px 0;width:100%;border-radius:14px;border:0;background:#c8553d;color:#fff}</style>
<p id="s">読み込み中…</p>
<button data-f="shitateya_promo_10s.mp4">音なし版を保存</button>
<button data-f="shitateya_promo_10s_bgm.mp4">BGMだけ版を保存</button>
<button data-f="shitateya_promo_10s_voice.mp4">声＋BGM版を保存</button>
<script>
const files={};
Promise.all([...document.querySelectorAll('button')].map(async b=>{const f=b.dataset.f;const r=await fetch(f);files[f]=new File([await r.blob()],f,{type:'video/mp4'});})).then(()=>s.textContent='準備できました');
document.querySelectorAll('button').forEach(b=>b.onclick=()=>navigator.share({files:[files[b.dataset.f]]}).catch(e=>s.textContent=e.message));
</script></html>
