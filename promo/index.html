<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Promo</title>
<style>body{font-family:system-ui,sans-serif;padding:20px;max-width:480px;margin:auto}button{font-size:19px;padding:15px;margin:8px 0;width:100%;border-radius:14px;border:0;background:#d9482b;color:#fff}button.c{background:#1f1d1a}#s{color:#666}pre{white-space:pre-wrap;font-size:13px;background:#f3eee6;padding:10px;border-radius:10px}</style>
<h2 id="h"></h2><p id="s">Loading…</p>
<button id="sv">① Save silent video (TikTok)</button><button id="vv">① Save voice video (Instagram)</button>
<button class="c" id="ct">② Copy TikTok caption</button><button class="c" id="ci">② Copy Instagram caption</button>
<pre id="p"></pre>
<script>
(async()=>{const P=await (await fetch('posts.json')).json();const q=new URLSearchParams(location.search);
let i=q.has('i')?+q.get('i'):Math.floor((Date.now()+9*36e5)/864e5-Math.floor(Date.UTC(2026,10,16)/864e5))%P.length;i=((i%P.length)+P.length)%P.length;
const e=P[i];h.textContent='Today: '+e.v;p.textContent=e.tt;const F={};
for(const k of ['silent','voice']){const f=`en_${e.v}_${k}.mp4`;F[k]=new File([await (await fetch(f)).blob()],f,{type:'video/mp4'})}s.textContent='Ready';
sv.onclick=()=>navigator.share({files:[F.silent]}).catch(x=>s.textContent=x.message);vv.onclick=()=>navigator.share({files:[F.voice]}).catch(x=>s.textContent=x.message);
const cp=t=>navigator.clipboard.writeText(t).then(()=>{s.textContent='Copied ✓';p.textContent=t},x=>s.textContent=x.message);ct.onclick=()=>cp(e.tt);ci.onclick=()=>cp(e.ig);})().catch(x=>s.textContent='Error '+x);
</script></html>
