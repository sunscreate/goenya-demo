<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#c9563c}svg{display:block}text{font-family:"Noto Sans CJK JP",sans-serif}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dc6a4e"/><stop offset="1" stop-color="#b5452d"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff6c9" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient>
<clipPath id="screen"><rect x="-150" y="-260" width="300" height="520" rx="46"/></clipPath>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<rect id="frameStitch" x="36" y="36" width="1008" height="1848" rx="40" fill="none" stroke="#fffaf3" stroke-opacity=".3" stroke-width="7" stroke-dasharray="38 24" stroke-linecap="round"/>
<g id="deco" fill="#fffaf3" opacity=".14"><rect x="90" y="300" width="110" height="110" rx="28"/><rect x="870" y="250" width="90" height="90" rx="22"/><rect x="120" y="1500" width="90" height="90" rx="22"/><rect x="840" y="1560" width="120" height="120" rx="30"/></g>
<g id="badge"></g>
<g id="cap" text-anchor="middle" fill="#fffaf3"></g>
<g id="phone">
 <rect x="-170" y="-280" width="340" height="560" rx="60" fill="#fffaf3"/>
 <rect x="-60" y="-252" width="120" height="20" rx="10" fill="#e8d9c7"/>
 <g id="clutter" clip-path="url(#screen)"></g>
 <g id="mine" clip-path="url(#screen)"></g>
 <circle id="glowc" cx="0" cy="-150" r="200" fill="url(#glow)"/>
 <rect id="phoneStitch" x="-196" y="-306" width="392" height="612" rx="84" fill="none" stroke="#fffaf3" stroke-width="10" stroke-dasharray="34 22" stroke-linecap="round"/>
 <g id="xmarks"></g>
</g>
<path id="thread" fill="none" stroke="#1f2a33" stroke-width="8" stroke-linecap="round"/>
<g id="needle"><rect x="-11" y="-150" width="22" height="300" rx="11" fill="#1f2a33"/><ellipse cx="0" cy="-112" rx="5" ry="20" fill="#dc6a4e"/><path d="M-11 128 L0 186 L11 128 Z" fill="#1f2a33"/></g>
<g id="logo" text-anchor="middle" fill="#fffaf3"></g>
</svg>
<script>
const P=new URLSearchParams(location.search);const T=JSON.parse(decodeURIComponent(P.get('t')));const EP=P.get('ep');
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eout=x=>1-Math.pow(1-x,3),back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function el(tag,a,p,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;p.appendChild(e);return e;}
const cl=$('clutter');for(let r=0;r<6;r++)for(let c=0;c<4;c++)el('rect',{x:-130+c*68,y:-200+r*72,width:52,height:52,rx:14,fill:['#b9b4ad','#cfc9c1','#a9a39b'][(r+c)%3]},cl);
const xm=$('xmarks');[[-100,-120],[60,-40],[-40,80],[90,150]].forEach(([x,y])=>{const g=el('g',{transform:`translate(${x} ${y})`},xm);el('circle',{r:30,fill:'#d64545'},g);el('path',{d:'M-12 -12 L12 12 M12 -12 L-12 12',stroke:'#fff','stroke-width':7,'stroke-linecap':'round'},g);});
// my app screen
const mine=$('mine');
const hdr=el('g',{},mine);el('rect',{x:-150,y:-260,width:300,height:120,fill:T.c},hdr);
const nm=T.name.length>6?30:36;el('text',{x:0,y:-180,'font-size':nm,'font-weight':900,fill:'#fff','text-anchor':'middle'},hdr,T.name);
const cards=T.f.map((f,i)=>{const g=el('g',{},mine);const y=-110+i*112;el('rect',{x:-130,y:y,width:260,height:92,rx:20,fill:'#fff',stroke:'#eadfd2','stroke-width':3},g);el('circle',{cx:-90,cy:y+46,r:24,fill:T.c},g);el('path',{d:`M${-101} ${y+46} l8 9 l15 -18`,stroke:'#fff','stroke-width':6,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},g);const fs=Math.min(26,Math.floor(186/f.length));el('text',{x:-54,y:y+56,'font-size':fs,'font-weight':700,fill:'#1f2a33'},g,f);return g;});
function caption(lines,t,tin,tout,y0,size){const g=$('cap');g.innerHTML='';const a=eout(seg(t,tin,tin+.35))*(1-seg(t,tout-.3,tout));if(a<=0)return;lines.forEach((L,i)=>{const s=L.s||size;el('text',{x:540,y:y0+i*(s*1.22),'font-size':s,'font-weight':900,opacity:a,fill:L.hl?'#fff1b8':'#fffaf3',transform:`translate(0 ${(1-eout(seg(t,tin+i*.12,tin+i*.12+.4)))*30})`},g,L.t);});}
function fit(s,base){return s.length>11?Math.round(base*11/s.length):base;}
function render(t){
 const up=eio(seg(t,7.0,7.8)),sc=1.3-0.48*up,py=1080-300*up,pop=back(seg(t,-0.25,.45));
 $('phone').setAttribute('transform',`translate(540 ${py}) scale(${sc*pop})`);
 // badge
 const b=$('badge');b.innerHTML='';const ba=seg(t,-.4,0)*(1-seg(t,6.7,7.0));if(ba>0){const g=el('g',{opacity:ba},b);el('rect',{x:340,y:150,width:400,height:70,rx:35,fill:'#1f2a33',opacity:.85},g);el('text',{x:540,y:197,'font-size':34,'font-weight':700,fill:'#fff1b8','text-anchor':'middle'},g,`仕立てた アプリ #${EP}`);}
 const clv=1-eout(seg(t,2.6,3.2));$('clutter').setAttribute('opacity',clv);
 const xs=[...$('xmarks').children];xs.forEach((g,i)=>{const p=back(seg(t,1.0+i*.3,1.3+i*.3));g.setAttribute('opacity',seg(t,1.0+i*.3,1.1+i*.3)*clv);g.firstChild.setAttribute('r',30*p);});
 // phone shake while clutter
 const sh=t>1&&t<2.6?Math.sin(t*40)*4:0;$('xmarks').setAttribute('transform',`translate(${sh} 0)`);
 // my app
 const ma=seg(t,3.0,3.4);$('mine').setAttribute('opacity',ma);
 hdr.setAttribute('transform',`translate(0 ${(1-eout(seg(t,3.0,3.5)))*-120})`);
 cards.forEach((g,i)=>{const p=seg(t,3.9+i*.45,4.3+i*.45);g.setAttribute('opacity',p);g.setAttribute('transform',`translate(${(1-back(p))*260} 0)`);});
 $('glowc').setAttribute('opacity',Math.sin(Math.PI*seg(t,5.6,6.8))*.8);
 // needle stitches header 3.2-4.0
 const sew=seg(t,3.1,4.2),nA=seg(t,3.0,3.3),nO=seg(t,4.2,4.6);
 const hx=540+(-120+240*sew)*sc,hy=py+(-140)*sc,d=40*Math.abs(Math.sin(sew*Math.PI*6));
 const nx=hx+60+0.62*d+nO*500,ny=hy-80-0.79*d-(1-eout(nA))*300-nO*200;
 $('needle').setAttribute('transform',`translate(${nx} ${ny}) rotate(38) scale(.8)`);$('needle').setAttribute('opacity',eout(nA)*(1-nO));
 $('thread').setAttribute('d',`M${540-120*sc} ${hy} L${hx} ${hy} C ${hx+40} ${hy+40}, ${nx+120} ${ny+60}, ${nx+55} ${ny-70}`);$('thread').setAttribute('opacity',nA*(1-nO));
 $('phoneStitch').setAttribute('stroke-dashoffset',-t*40);$('frameStitch').setAttribute('stroke-dashoffset',t*30);$('deco').setAttribute('transform',`translate(0 ${Math.sin(t*1.2)*12})`);
 if(t<3.0) caption([{t:T.hook[0],s:fit(T.hook[0],84)},{t:T.hook[1],s:fit(T.hook[1],84)}],t,-.6,3.0,330,84);
 else if(t<7) caption([{t:'だから、仕立てました。',s:56},{t:T.name+'アプリ',hl:1,s:fit(T.name+'アプリ',96)}],t,3.05,6.95,320,84);
 else $('cap').innerHTML='';
 const lg=$('logo');lg.innerHTML='';const L=eout(seg(t,7.5,8.0));
 if(L>0){el('text',{x:540,y:1190,'font-size':112,'font-weight':900,opacity:L,'letter-spacing':6,transform:`translate(0 ${(1-L)*40})`},lg,'アプリのしたてや');
  const u=eio(seg(t,7.8,8.5));el('line',{x1:170,y1:1232,x2:170+740*u,y2:1232,stroke:'#fffaf3','stroke-width':8,'stroke-dasharray':'24 14','stroke-linecap':'round'},lg);
  el('text',{x:540,y:1316,'font-size':52,'font-weight':700,opacity:eout(seg(t,8.2,8.6))},lg,'あなたの「ほしい」を、アプリに。');
  const C=back(seg(t,8.7,9.15));const cg=el('g',{transform:`translate(540 1420) scale(${C})`,opacity:seg(t,8.7,8.9)},lg);
  el('rect',{x:-400,y:-58,width:800,height:116,rx:58,fill:'#fffaf3'},cg);el('text',{x:0,y:16,'font-size':44,'font-weight':900,fill:'#b5452d'},cg,'試作まで無料 ▶ プロフィールから');}
}
window.render=render;render(0);
</script></body></html>
