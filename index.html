  <meta charset="UTF-8">
  <meta name="google-signin-client_id" content="742946147296-8le8a4n6p2260pb68p5dhv496hi7tl9e.apps.googleusercontent.com">

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Android（Chrome）の「ホーム画面に追加」をアプリのボタンから出せるように取っておく
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__sonobaInstall = e; });
    window.sonobaInstall = function () {
      var e = window.__sonobaInstall; if (!e) return false;
      e.prompt(); window.__sonobaInstall = null; return true;
    };
    // 50音順に並べる（日本語の並べ方）
    window.sonobaJaCmp = (function () { var c = new Intl.Collator('ja', { sensitivity: 'base', numeric: true }); return function (a, b) { return c.compare(a, b); }; })();
    // 「別のGoogleアカウントでつなぐ」：必ずアカウントを選ぶ画面を出す（GoogleのGISを直接呼ぶ）
    window.sonobaPickAccount = function (cid, scope) {
      return new Promise(function (ok, ng) {
        try {
          google.accounts.oauth2.initTokenClient({
            client_id: cid, scope: scope, prompt: 'select_account',
            callback: function (r) { r && r.access_token ? ok(r.access_token) : ng(new Error((r && r.error) || 'canceled')); },
            error_callback: function (e) { ng(new Error((e && e.type) || 'popup_failed')); }
          }).requestAccessToken();
        } catch (e) { ng(e); }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
