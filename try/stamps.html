<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Japan Stamp Book — your trip bucket list</title>
<meta name="description" content="45 things to eat, see and do in Japan. Tap to collect a red hanko stamp, add the date and a note. Works offline.">
<meta name="theme-color" content="#d9482b">
<link rel="canonical" href="https://tabipocket.vercel.app/try/stamps.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Yuji+Syuku&display=swap">
<style>:root{--paper:#faf6ef;--card:#fff;--ink:#1f1d1a;--sub:#6b655c;--line:#e7dfd2;--shu:#d9482b;--shu2:#fbe4dc;--ai:#27466e;--ok:#2f8a5b;--r:18px}
@media (prefers-color-scheme:dark){:root{--paper:#16130f;--card:#221e19;--ink:#f3eee6;--sub:#b3aa9c;--line:#3a332b;--shu2:#4a2318}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:"DM Sans","Zen Kaku Gothic New",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
.jp{font-family:"Zen Kaku Gothic New",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .logo{width:34px;height:34px;border-radius:10px;background:var(--shu);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
header.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
header.top small{display:block;font-size:11.5px;color:var(--sub);font-weight:500}
main{max-width:560px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.h{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:18px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;background:var(--shu);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;border-radius:11px;font-size:14px}
.btn:active{transform:scale(.98)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--shu);border-color:transparent}
label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;background:var(--card);cursor:pointer;user-select:none}
.chip.on{background:var(--shu);border-color:var(--shu);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,15,10,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.demo{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ai);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;font-size:13.5px}
.demo b{display:block;font-size:14.5px}
.demo a{margin-left:auto;background:#fff;color:var(--ai);font-weight:700;border-radius:11px;padding:9px 13px;text-decoration:none;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.foot{text-align:center;font-size:12px;color:var(--sub);margin:26px 0 8px}
.foot a{color:var(--sub)}

.prog{display:flex;align-items:center;gap:14px}
.prog .ring{width:74px;height:74px;flex:none}
.prog b{font-size:28px;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 4px;margin:14px 0 4px}
.tabs .chip{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px 10px;text-align:center;cursor:pointer;min-height:118px;display:flex;flex-direction:column;align-items:center;gap:6px}
.it .em{font-size:30px;line-height:1}
.it b{font-size:13px;line-height:1.25}
.it .jp{font-size:11.5px;color:var(--sub)}
.it .hk{position:absolute;left:50%;top:10px;margin-left:-31px;width:62px;height:62px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);font-family:"Yuji Syuku",serif;display:grid;place-items:center;font-size:14px;line-height:1.05;transform:rotate(-14deg);opacity:0;background:rgba(255,255,255,.0);mix-blend-mode:multiply;text-align:center;padding:4px}
.it.on .hk{opacity:.9}
.it.on .em{filter:saturate(.6)}
.it.pop .hk{animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.9}}
.it.lock{opacity:.45}
.it .dt{font-size:10.5px;color:var(--shu);font-weight:700;min-height:13px}
.add{border-style:dashed;color:var(--sub);justify-content:center}
.stars{display:flex;gap:6px;font-size:28px}.stars span{cursor:pointer;opacity:.3}.stars span.on{opacity:1}
</style></head>
<body>
<header class="top"><div class="logo jp">判</div><div><h1>Japan Stamp Book</h1><small>Eat · See · Do — collect them all</small></div></header>
<main>
  <div class="card prog"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="arc" cx="18" cy="18" r="15.5" fill="none" stroke="var(--shu)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100" transform="rotate(-90 18 18)"/></svg>
    <div><b id="cnt">0 / 45</b><div class="muted" id="lvl">Tap anything you've done to stamp it.</div></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <p class="foot">Data stays on this phone. No account, no ads. · <a href="../">Tabi Pocket</a></p>
</main>
<div class="sheet" id="sh"><div class="in">
  <div class="row"><span id="dEm" style="font-size:34px"></span><div class="grow"><b style="font-size:18px" id="dT"></b><div class="muted jp" id="dJ"></div></div><button class="btn ghost sm" data-close>Close</button></div>
  <p class="muted" id="dTip" style="margin-top:10px"></p>
  <label for="dDate">Date</label><input type="date" id="dDate">
  <label for="dWhere">Where</label><input id="dWhere" placeholder="e.g. Ichiran, Shibuya" maxlength="60">
  <label>Rating</label><div class="stars" id="dStars"></div>
  <label for="dNote">Note</label><textarea id="dNote" rows="3" maxlength="300" placeholder="What was it like?"></textarea>
  <div class="row" style="margin-top:16px"><button class="btn ghost" id="dUn">Remove stamp</button><button class="btn grow" id="dSave">Stamp it 判</button></div>
</div></div>
<div class="sheet" id="shAdd"><div class="in">
  <div class="row"><b style="font-size:18px">Add your own</b><button class="btn ghost sm" style="margin-left:auto" data-close>Close</button></div>
  <label for="aT">What is it?</label><input id="aT" maxlength="30" placeholder="e.g. Ghibli Museum">
  <label for="aE">Emoji</label><input id="aE" maxlength="4" placeholder="⭐">
  <div class="row" style="margin-top:16px"><button class="btn grow" id="aSave">Add</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="demo"><div><b>Free demo</b>Nothing you enter is saved.</div><a href="https://buy.stripe.com/bJe6oIgBH7h7cL98769IU1V">Get the app · $4.99</a></div>
<script>
const FULL=false;
const K='tabi-stamps-v1',$=s=>document.querySelector(s);
const L=[
['food','🍜','Ramen','ラーメン','Slurping is polite here. Try tonkotsu in Fukuoka or miso in Sapporo.'],
['food','🍣','Sushi at a counter','寿司','Sit at the counter and order omakase (chef’s choice).'],
['food','🍙','Konbini onigiri','おにぎり','Pull tab 1, then the sides, to keep the seaweed crisp.'],
['food','🐙','Takoyaki','たこ焼き','Osaka street food. Very hot inside — wait a moment.'],
['food','🥞','Okonomiyaki','お好み焼き','Osaka style is mixed; Hiroshima style is layered with noodles.'],
['food','🥩','Wagyu','和牛','Kobe, Matsusaka and Omi are the famous names.'],
['food','🍤','Tempura','天ぷら','Best eaten right as it comes out of the oil.'],
['food','🍵','Matcha','抹茶','Uji near Kyoto is the home of matcha.'],
['food','🍢','Yakitori','焼き鳥','Order “shio” (salt) or “tare” (sweet sauce).'],
['food','🍲','Udon','うどん','Kagawa (Sanuki udon) is the udon capital.'],
['food','🥢','Soba','そば','Cold zaru soba is dipped, not poured.'],
['food','🥟','Gyoza','餃子','Utsunomiya and Hamamatsu compete for the gyoza crown.'],
['food','🍱','Kaiseki dinner','懐石','A multi-course seasonal meal, often at a ryokan.'],
['food','🍈','Melon pan','メロンパン','Sweet bun with a crunchy top. Usually no melon in it!'],
['food','🍡','Mochi or dango','団子','Try warm mochi from a street stall.'],
['food','🥤','Vending machine drink','自販機','Some sell hot drinks in winter — look for the red labels.'],
['food','🏮','Izakaya night','居酒屋','A small appetizer (otoshi) is often charged automatically.'],
['food','🍬','Wagashi sweets','和菓子','Traditional sweets that change with the seasons.'],
['see','⛩️','Fushimi Inari','伏見稲荷大社','Thousands of torii gates. Go early morning to avoid crowds.'],
['see','🚦','Shibuya Crossing','渋谷スクランブル交差点','Up to thousands cross at once. View from above, then walk it.'],
['see','🗻','Mt. Fuji view','富士山','Clearest on winter mornings.'],
['see','🏯','Senso-ji','浅草寺','Tokyo’s oldest temple. Try the omikuji fortune.'],
['see','🦌','Nara deer','奈良の鹿','They bow for crackers (shika senbei).'],
['see','🎋','Arashiyama bamboo','嵐山 竹林','Kyoto bamboo grove. Best before 8 a.m.'],
['see','🌃','Dotonbori','道頓堀','Osaka’s neon river street. Find the Glico runner.'],
['see','🕊️','Hiroshima Peace Park','平和記念公園','Allow time for the museum.'],
['see','⛩️','Miyajima floating torii','厳島神社','Check tide times — it “floats” at high tide.'],
['see','✨','Kinkaku-ji','金閣寺','The Golden Pavilion in Kyoto.'],
['see','🏰','Osaka Castle','大阪城','Beautiful park around it, especially in spring.'],
['see','🗼','Tokyo Tower or Skytree','東京タワー','Go at sunset to see the city light up.'],
['do','♨️','Onsen','温泉','Wash before entering. No swimsuits. Towels stay out of the water.'],
['do','🚄','Shinkansen','新幹線','Sit on the right side (Tokyo→Osaka) for Mt. Fuji.'],
['do','🛏️','Ryokan stay','旅館','Take off shoes at the entrance; wear the yukata provided.'],
['do','👘','Kimono or yukata','着物','Rent one in Kyoto or Asakusa. Left side over right!'],
['do','📜','Goshuin stamp','御朱印','Hand-written temple seals. Bring a goshuin book.'],
['do','🎤','Karaoke','カラオケ','Private rooms, often with all-you-can-drink plans.'],
['do','🛌','Capsule hotel','カプセルホテル','Quiet please — and earplugs help.'],
['do','📸','Purikura','プリクラ','Photo booths with wild filters, inside game centers.'],
['do','🛁','Sento','銭湯','Neighborhood public bath. Bring a small towel.'],
['do','🍵','Tea ceremony','茶道','Turn the bowl before you drink.'],
['do','🌸','Cherry blossoms','桜','Late March to early April in Tokyo and Kyoto.'],
['do','🍁','Autumn leaves','紅葉','Mid to late November in Kyoto.'],
['do','🕹️','Game center','ゲームセンター','Try the crane games — good luck!'],
['do','🎰','Capsule toys','ガチャ','Hundreds of machines in Akihabara and Ikebukuro.'],
['do','🔮','Omikuji fortune','おみくじ','Bad fortune? Tie it on the rack and leave it behind.']].map((x,i)=>({id:'b'+i,cat:x[0],em:x[1],t:x[2],j:x[3],tip:x[4]}));
const TABS=[['all','All'],['food','🍜 Eat'],['see','⛩️ See'],['do','♨️ Do'],['mine','⭐ Mine']];
let S;try{S=FULL?JSON.parse(localStorage.getItem(K)||'null'):null}catch(e){S=null}
if(!S)S={st:{},own:[]};
if(!FULL)S={st:{b0:{d:'2026-03-28',w:'Ichiran, Shibuya',r:5,n:'Ordered extra noodles!'},b20:{d:'2026-03-29',w:'Kawaguchiko',r:5,n:''},b30:{d:'2026-03-30',w:'Hakone',r:4,n:''}},own:[]};
const save=()=>{if(!FULL)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}
const all=()=>[...L,...S.own];let tab='all',cur=null,stars=0,popId=null;
const hk=it=>{const j=it.j||'記念';return j.length>4?j.slice(0,4):j};
function render(){const A=all(),n=Object.keys(S.st).filter(k=>A.some(a=>a.id===k)).length;
 $('#cnt').textContent=`${n} / ${A.length}`;$('#arc').setAttribute('stroke-dasharray',`${A.length?n/A.length*100:0} 100`);
 $('#lvl').textContent=n===0?'Tap anything you’ve done to stamp it.':n<10?'Nice start! Keep collecting.':n<25?'Seasoned traveler 🎌':'Japan expert! 🏆';
 $('#tabs').innerHTML=TABS.map(t=>`<span class="chip${t[0]===tab?' on':''}" data-t="${t[0]}">${t[1]}</span>`).join('');
 const it=A.filter(a=>tab==='all'||a.cat===tab||(tab==='mine'&&a.cat==='mine'));
 $('#grid').innerHTML=it.map(a=>{const s=S.st[a.id];return `<div class="it${s?' on':''}${a.id===popId?' pop':''}" data-id="${a.id}"><span class="em">${a.em}</span><b>${esc(a.t)}</b><span class="jp">${esc(a.j||'')}</span><span class="dt">${s&&s.d?s.d.slice(5).replace('-','/'):''}</span><span class="hk jp">${esc(hk(a))}</span></div>`}).join('')+((tab==='all'||tab==='mine')?'<div class="it add" id="addOwn"><span class="em">＋</span><b>Add your own</b></div>':'');popId=null}
$('#tabs').onclick=e=>{const c=e.target.closest('[data-t]');if(c){tab=c.dataset.t;render()}};
$('#grid').onclick=e=>{if(e.target.closest('#addOwn')){$('#aT').value='';$('#aE').value='';$('#shAdd').classList.add('open');return}
 const c=e.target.closest('[data-id]');if(!c)return;cur=all().find(a=>a.id===c.dataset.id);const s=S.st[cur.id]||{};
 $('#dEm').textContent=cur.em;$('#dT').textContent=cur.t;$('#dJ').textContent=cur.j||'';$('#dTip').textContent=cur.tip||'';
 $('#dDate').value=s.d||new Date().toISOString().slice(0,10);$('#dWhere').value=s.w||'';$('#dNote').value=s.n||'';stars=s.r||0;drawStars();
 $('#dUn').style.display=S.st[cur.id]?'':'none';$('#dSave').textContent=S.st[cur.id]?'Save':'Stamp it 判';$('#sh').classList.add('open')};
function drawStars(){$('#dStars').innerHTML=[1,2,3,4,5].map(i=>`<span data-s="${i}" class="${i<=stars?'on':''}">★</span>`).join('')}
$('#dStars').onclick=e=>{const s=e.target.closest('[data-s]');if(s){stars=+s.dataset.s;drawStars()}};
$('#dSave').onclick=()=>{const was=!!S.st[cur.id];S.st[cur.id]={d:$('#dDate').value,w:$('#dWhere').value.trim(),r:stars,n:$('#dNote').value.trim()};if(!was)popId=cur.id;save();render();$('#sh').classList.remove('open');if(!was)toast(FULL?'Stamped! 判':'Stamped (demo — not saved)');if(!was&&navigator.vibrate)navigator.vibrate(30)};
$('#dUn').onclick=()=>{delete S.st[cur.id];save();render();$('#sh').classList.remove('open')};
$('#aSave').onclick=()=>{const t=$('#aT').value.trim();if(!t)return;S.own.push({id:'o'+Date.now(),cat:'mine',em:$('#aE').value.trim()||'⭐',t,j:'',tip:''});save();tab='mine';render();$('#shAdd').classList.remove('open')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').classList.remove('open'));
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('open')}));
render();
/*SWSLOT*/
</script></body></html>
